[package]
name = "app"
version = "1.0.0"
description = "SVG to DXF Converter - Professional vector graphics conversion tool"
authors = ["TemplarD"]
license = "MIT"
repository = "https://github.com/TemplarD/SVGtoDXF"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# SVG и DXF библиотеки
svg = "0.15"
dxf = "0.5"
anyhow = "1.0"
thiserror = "1.0"
# Файловая система
dirs = "5.0"
# Время и дата
chrono = { version = "0.4", features = ["serde"] }
# XML парсинг
xmlparser = "0.13"
