# Глобальные настройки cargo для проекта SVGtoDXF.
#
# windows_subsystem = "windows" — ключевой фикс: собирает GUI-приложение без
# консольного окна. Без этого при запуске .exe в Windows всплывает чёрное окно
# консоли, закрытие которого завершает и основное приложение.
# Применимо только к Windows-таргетам, на Linux/macOS игнорируется.
#
# Основной механизм — crate-уровневый атрибут #![windows_subsystem="windows"]
# в crates/tauri_app/src/main.rs. rustflags ниже — дублирующая страховка на
# случай, если атрибут не сработает (например, при сборке не через main.rs).

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=-Wl,--subsystem,windows"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-Wl,--subsystem,windows"]
