<!DOCTYPE html>
<html>
<head>
    <title>Test Tauri API</title>
</head>
<body>
    <h1>Тест Tauri API</h1>
    <button onclick="testAPI()">Проверить API</button>
    <button onclick="testListDir()">Проверить список файлов</button>
    <div id="output"></div>
    
    <script>
        function log(msg) {
            const output = document.getElementById('output');
            output.innerHTML += '<div>' + msg + '</div>';
            console.log(msg);
        }
        
        function testAPI() {
            log('Проверяем window.__TAURI__: ' + typeof window.__TAURI__);
            if (window.__TAURI__) {
                log('Доступные свойства: ' + Object.keys(window.__TAURI__));
                if (window.__TAURI__.core) {
                    log('Core доступен: ' + typeof window.__TAURI__.core.invoke);
                } else {
                    log('Core недоступен');
                }
            }
        }
        
        async function testListDir() {
            try {
                log('Пробуем вызвать list_directory...');
                const result = await window.__TAURI__.core.invoke('list_directory', { path: '/' });
                log('Успех! Получено элементов: ' + result.length);
                log('Первый элемент: ' + JSON.stringify(result[0]));
            } catch (error) {
                log('Ошибка: ' + error.message);
            }
        }
    </script>
</body>
</html>
